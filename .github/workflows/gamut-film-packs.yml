# Gamut: export each film's prepared tables from Fotufilm's engine, on Linux, without Halide.
# Run it from the Actions tab (Gamut film packs -> Run workflow); download "gamut-film-packs".
name: Gamut film packs
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-24.04
    env:
      FOTUFILM_DISABLE_HALIDE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build the exporter
        run: swift build -c release --product gamut-film-export
      - name: Export the packs
        run: |
          .build/release/gamut-film-export packs 2000 1333
          cp Sources/FotufilmHalide/config-layout.json packs/
          mkdir -p packs/stocks packs/licenses
          cp Sources/FotufilmCore/Stocks/*.json packs/stocks/
          cp LICENSE NOTICE LICENSING.md packs/licenses/
          cp licenses/FILM-PROFILES.txt packs/licenses/ || true
          git rev-parse HEAD > packs/fotufilm-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gamut-film-packs
          path: packs
